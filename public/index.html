    // 이메일 유효성 검사
    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // 로그인 실행 (Supabase.auth.signInWithPassword 연동)
    async function handleLogin() {
      clearAuthMessage();
      const email = authEmail.value.trim();
      const password = authPassword.value;

      if (!email) {
        showAuthMessage('이메일을 입력해 주세요.', 'error');
        authEmail.focus();
        return;
      }
      if (!validateEmail(email)) {
        showAuthMessage('올바른 이메일 형식을 입력해 주세요.', 'error');
        authEmail.focus();
        return;
      }
      if (!password) {
        showAuthMessage('비밀번호를 입력해 주세요.', 'error');
        authPassword.focus();
        return;
      }

      btnLogin.disabled = true;
      btnLogin.style.opacity = '0.7';
      showAuthMessage('로그인 중입니다...', 'success');

      try {
        if (!supabase) {
          await initSupabase();
        }

        // 1. supabase.auth.signInWithPassword 함수를 사용해 로그인 시도
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          let errMsg = error.message;
          if (errMsg.includes('Invalid login credentials')) {
            errMsg = '이메일 또는 비밀번호가 올바르지 않습니다.';
          } else if (errMsg.includes('Email not confirmed')) {
            errMsg = '이메일 인증이 완료되지 않았습니다. 메일함의 가입확인 이메일을 확인해 주세요.';
          }
          showAuthMessage(`로그인 실패: ${errMsg}`, 'error');
          return;
        }

        // 2. 로그인 성공 시 로그인 폼을 숨기고 기존 일기장 화면을 보여줌 (상단 이메일 및 로그아웃 버튼 표시)
        const user = data.user || { email: email };
        const sessionUser = {
          email: user.email || email,
          id: user.id || null,
          loggedInAt: new Date().toISOString()
        };
        saveAuthSession(sessionUser);

        showAuthMessage('로그인에 성공했습니다!', 'success');
        setTimeout(() => {
          showDiaryView(sessionUser);
        }, 200);

      } catch (err) {
        console.error('Login error:', err);
        showAuthMessage(`로그인 중 오류가 발생했습니다: ${err.message}`, 'error');
      } finally {
        btnLogin.disabled = false;
        btnLogin.style.opacity = '1';
      }
    }

    // 회원가입 실행 (Supabase.auth.signUp 연동)
    async function handleSignup() {
      clearAuthMessage();
      const email = authEmail.value.trim();
      const password = authPassword.value;

      if (!email) {
        showAuthMessage('이메일을 입력해 주세요.', 'error');
        authEmail.focus();
        return;
      }
      if (!validateEmail(email)) {
        showAuthMessage('올바른 이메일 형식을 입력해 주세요.', 'error');
        authEmail.focus();
        return;
      }
      if (!password) {
        showAuthMessage('비밀번호를 입력해 주세요.', 'error');
        authPassword.focus();
        return;
      }
      if (password.length < 6) {
        showAuthMessage('비밀번호는 최소 6자 이상이어야 합니다.', 'error');
        authPassword.focus();
        return;
      }

      btnSignup.disabled = true;
      btnSignup.style.opacity = '0.7';
      showAuthMessage('회원가입 요청 중입니다...', 'success');

      try {
        if (!supabase) {
          await initSupabase();
        }

        // Supabase 클라이언트를 사용해서 새로운 사용자 등록
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password
        });

        if (error) {
          showAuthMessage(`회원가입 실패: ${error.message}`, 'error');
          return;
        }

        // 회원가입 성공 시 사용자에게 '가입확인 이메일을 확인해 주세요' 메시지 표시
        authPassword.value = '';

        if (isSupabaseConnected) {
          showAuthMessage('가입확인 이메일을 확인해 주세요 (스팸 메일함도 함께 확인해 주세요)', 'success');
          alert('가입확인 이메일을 확인해 주세요!\nSupabase에서 확인 메일을 발송했습니다.\n(메일이 보이지 않으면 스팸 메일함도 확인해 주세요)');
        } else {
          showAuthMessage('가입확인 이메일을 확인해 주세요\n(💡 알림: 현재 Supabase 프로젝트 키가 설정되지 않아 실제 메일은 발송되지 않는 테스트 모드입니다. 실제 메일을 받으시려면 index.html의 SUPABASE_CONFIG 또는 .env에 Supabase URL/Key를 입력해 주세요)', 'success');
          alert('가입확인 이메일을 확인해 주세요\n\n[안내] 현재 Supabase 프로젝트 키가 등록되지 않아 실제 메일함으로는 발송되지 않는 로컬 테스트 모드입니다.\n실제 인증 메일을 수신하시려면 Supabase 대시보드의 URL과 Key를 설정해 주세요.');
        }
      } catch (err) {
        console.error('Signup error:', err);
        showAuthMessage(`회원가입 중 오류가 발생했습니다: ${err.message}`, 'error');
      } finally {
        btnSignup.disabled = false;
        btnSignup.style.opacity = '1';
      }
    }

    // Google 로그인 실행 (Supabase.auth.signInWithOAuth 연동)
    async function handleGoogleLogin() {
      clearAuthMessage();
      btnGoogleLogin.disabled = true;
      btnGoogleLogin.style.opacity = '0.7';
      showAuthMessage('Google 로그인 페이지로 연결 중...', 'success');

      try {
        if (!supabase) {
          await initSupabase();
        }

        // 로그인 완료 후 복귀할 리다이렉트 URL 설정
        const redirectTo = window.location.protocol.startsWith('http')
          ? window.location.origin + window.location.pathname
          : 'http://localhost:3000';

        // Supabase를 통해 Google 계정으로 로그인 (provider: 'google')
        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: redirectTo
          }
        });

        if (error) {
          showAuthMessage(`Google 로그인 실패: ${error.message}`, 'error');
          return;
        }

        // Fallback 모드(URL 리다이렉트가 없는 로컬 테스트)일 경우 일기장 화면 전환
        if (!data || !data.url) {
          const sessionUser = getAuthSession() || { email: 'google.user@gmail.com', provider: 'google' };
          showDiaryView(sessionUser);
        }

      } catch (err) {
        console.error('Google OAuth error:', err);
        showAuthMessage(`Google 로그인 중 오류가 발생했습니다: ${err.message}`, 'error');
      } finally {
        btnGoogleLogin.disabled = false;
        btnGoogleLogin.style.opacity = '1';
      }
    }

    // 로그아웃 실행 (Supabase.auth.signOut 연동)
    async function handleLogout() {
      if (!confirm('로그아웃 하시겠습니까?')) {
        return;
      }

      try {
        if (!supabase) {
          await initSupabase();
        }

        // 4. supabase.auth.signOut 함수를 사용하여 로그아웃 처리
        if (supabase && supabase.auth && supabase.auth.signOut) {
          await supabase.auth.signOut();
        }
      } catch (err) {
        console.warn('Supabase signOut 호출 중 오류:', err);
      } finally {
        // 실시간 채팅 정리
        leaveRealtimeChat();
        // 로컬 세션 삭제 및 캐시 정리 후 다시 로그인 폼 보여주기
        removeAuthSession();
        cleanupLegacyHistoryCaches(null);
        restoreUserDraft(null);
        showAuthView();
      }
    }

    // 이벤트 리스너 바인딩
    btnLogin.addEventListener('click', handleLogin);
    btnSignup.addEventListener('click', handleSignup);
    btnGoogleLogin.addEventListener('click', handleGoogleLogin);
    btnLogout.addEventListener('click', handleLogout);

    // ==========================================
    // 💡 실시간 채팅 (Realtime Chat) 기능 모듈
    // ==========================================
    const CHAT_STORAGE_KEY = 'emotion_diary_realtime_chat_msgs';
    let chatBroadcastChannel = null;
    let supabaseChatChannel = null;
    let currentChatUser = null;
    let chatMessagesList = [];

    // 채팅 시간 포맷 헬퍼 (예: 오후 3:24)
    function formatChatTime(isoString) {
      if (!isoString) return '';
      try {
        const d = new Date(isoString);
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? '오후' : '오전';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${ampm} ${hours}:${minutes}`;
      } catch (e) {
        return '';
      }
    }

    // 로컬 스토리지에서 채팅 내역 불러오기
    function getStoredChatMessages() {
      try {
        const data = localStorage.getItem(CHAT_STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        console.warn('채팅 내역 로드 오류:', e);
        return [];
      }
    }

    // 로컬 스토리지에 채팅 내역 저장 (최근 100개 유지)
    function saveStoredChatMessages(messages) {
      try {
        const trimmed = messages.slice(-100);
        localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(trimmed));
      } catch (e) {
        console.warn('채팅 내역 저장 실패:', e);
      }
    }

    // 💡 사용자별 프로필 아바타 URL 캐시 맵 & 비동기 조회 Promise 추적 객체
    const userAvatarCache = {};
    const userAvatarFetchPromises = {};

    // 💡 비동기로 Supabase avatars 버킷에서 특정 사용자의 실제 아바타 파일 조회 및 적용
    async function fetchAndApplyUserAvatar(userId, email) {
      if (!userId) return;

      // 이미 캐시에 유효한 URL이 있으면 다시 조회하지 않고 UI만 갱신
      if (userAvatarCache[userId]) {
        updateChatAvatars(userId, email, userAvatarCache[userId]);
        return;
      }

      // 동일 userId에 대한 중복 네트워크 요청 방지
      if (userAvatarFetchPromises[userId]) return;

      userAvatarFetchPromises[userId] = (async () => {
        try {
          if (!supabase || !supabase.storage) return;

          // 1. 해당 유저의 avatars 폴더 내 파일 목록 조회 (최신순)
          const { data: files, error } = await supabase.storage.from('avatars').list(userId, {
            limit: 5,
            sortBy: { column: 'created_at', order: 'desc' }
          });

          let avatarUrl = null;
          if (!error && Array.isArray(files) && files.length > 0) {
            // 실제 이미지 파일 찾기 (avatar.png 또는 avatar_... 등)
            const targetFile = files.find(f => f.name && !f.name.startsWith('.')) || files[0];
            if (targetFile) {
              const { data: pubData } = supabase.storage.from('avatars').getPublicUrl(`${userId}/${targetFile.name}`);
              if (pubData && pubData.publicUrl) {
                const cacheBust = targetFile.updated_at ? new Date(targetFile.updated_at).getTime() : Date.now();
                avatarUrl = `${pubData.publicUrl}?t=${cacheBust}`;
              }
            }
          }

          // 폴더 파일이 바로 조회되지 않을 경우 avatar.png 기본 시도
          if (!avatarUrl) {
            const { data: defaultPub } = supabase.storage.from('avatars').getPublicUrl(`${userId}/avatar.png`);
            if (defaultPub && defaultPub.publicUrl) {
              avatarUrl = `${defaultPub.publicUrl}?t=${Date.now()}`;
            }
          }

          if (avatarUrl) {
            userAvatarCache[userId] = avatarUrl;
            if (email) userAvatarCache[email.toLowerCase()] = avatarUrl;
            localStorage.setItem(`user_avatar_${userId}`, avatarUrl);
            updateChatAvatars(userId, email, avatarUrl);
          }
        } catch (e) {
          console.warn(`사용자(${userId}) 아바타 조회 예외:`, e);
        } finally {
          delete userAvatarFetchPromises[userId];
        }
      })();
    }

    // 특정 사용자의 프로필 아바타 URL 확인
    function getAvatarUrlForUser(userId, email, isMine) {
      if (isMine) {
        // 본인인 경우 현재 화면 상단 아바타 이미지 또는 로컬 스토리지 캐시 우선
        if (profileAvatarImg && profileAvatarImg.src && profileAvatarImg.style.display !== 'none') {
          return profileAvatarImg.src;
        }
        if (currentChatUser?.user_metadata?.avatar_url) {
          return currentChatUser.user_metadata.avatar_url;
        }
        if (userId && localStorage.getItem(`user_avatar_${userId}`)) {
          return localStorage.getItem(`user_avatar_${userId}`);
        }
      }

      // 1. 메모리 캐시 확인
      if (userId && userAvatarCache[userId]) return userAvatarCache[userId];
      if (email && userAvatarCache[email.toLowerCase()]) return userAvatarCache[email.toLowerCase()];

      // 2. localStorage 캐시 확인
      if (userId) {
        const cached = localStorage.getItem(`user_avatar_${userId}`);
        if (cached) {
          userAvatarCache[userId] = cached;
          return cached;
        }
      }

      // 3. 캐시에 없으면 비동기로 Supabase avatars 버킷에서 실제 아바타 파일 탐색 및 자동 적용
      if (userId && supabase && supabase.storage) {
        fetchAndApplyUserAvatar(userId, email);
      }

      return null;
    }

    // 채팅 내 특정 사용자의 아바타 이미지들을 즉시 새로운 사진으로 변경
    function updateChatAvatars(userId, email, newAvatarUrl) {
      if (!newAvatarUrl) return;

      // 캐시 갱신
      if (userId) userAvatarCache[userId] = newAvatarUrl;
      if (email) userAvatarCache[email.toLowerCase()] = newAvatarUrl;

      // 현재 DOM에 렌더링된 모든 메시지 중 해당 사용자의 아바타 엘리먼트 탐색
      const targetAvatars = [];
      if (userId) {
        document.querySelectorAll(`.chat-msg-avatar[data-user-id="${userId}"]`).forEach(el => targetAvatars.push(el));
      }
      if (email) {
        document.querySelectorAll(`.chat-msg-avatar[data-user-email="${email.toLowerCase()}"]`).forEach(el => {
          if (!targetAvatars.includes(el)) targetAvatars.push(el);
        });
      }

      // 본인 메시지의 경우 wrapper.mine 요소의 아바타도 확실하게 갱신
      const isCurrentUser = currentChatUser && (
        (userId && currentChatUser.id === userId) || 
        (email && currentChatUser.email && currentChatUser.email.toLowerCase() === email.toLowerCase())
      );
      if (isCurrentUser) {
        document.querySelectorAll('.chat-bubble-wrapper.mine .chat-msg-avatar').forEach(el => {
          if (!targetAvatars.includes(el)) targetAvatars.push(el);
        });
      }

      targetAvatars.forEach(avatarEl => {
        let img = avatarEl.querySelector('.chat-msg-avatar-img');
        const fallback = avatarEl.querySelector('.chat-msg-avatar-fallback');
        if (!img) {
          img = document.createElement('img');
          img.className = 'chat-msg-avatar-img';
          img.alt = '프로필';
          img.onerror = function() {
            this.style.display = 'none';
            if (fallback) fallback.style.display = 'flex';
          };
          avatarEl.insertBefore(img, avatarEl.firstChild);
        }
        img.src = newAvatarUrl;
        img.style.display = 'block';
        if (fallback) fallback.style.display = 'none';
      });
    }

    // 💡 5. 채팅 이미지 로드 실패 시 대체 UI 조치 및 재시도 지원
    window.handleChatImageError = function(imgEl, originalUrl) {
      if (!imgEl) return;
      const container = imgEl.closest('.chat-image-container');
      if (container) {
        container.innerHTML = `
          <div class="chat-image-fallback" title="이미지를 불러올 수 없습니다">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
              <circle cx="9" cy="9" r="2"></circle>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
              <line x1="3" y1="3" x2="21" y2="21" stroke="#ef4444" stroke-width="2"></line>
            </svg>
            <span class="chat-image-fallback-text">이미지를 불러올 수 없습니다</span>
            <button type="button" class="btn-retry-image" onclick="window.retryChatImage(this, '${escapeHtml(originalUrl)}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"></path>
              </svg>
              다시 시도
            </button>
          </div>
        `;
      }
    };

    // 이미지 다시 시도 함수
    window.retryChatImage = function(btnEl, originalUrl) {
      const container = btnEl.closest('.chat-image-container');
      if (!container || !originalUrl) return;
      const separator = originalUrl.includes('?') ? '&' : '?';
      const cacheBustedUrl = `${originalUrl}${separator}retry=${Date.now()}`;
      container.innerHTML = `
        <img 
          class="chat-sent-image" 
          src="${escapeHtml(cacheBustedUrl)}" 
          alt="채팅 이미지" 
          loading="lazy"
          onload="this.classList.add('loaded');"
          onerror="window.handleChatImageError(this, '${escapeHtml(originalUrl)}');"
          onclick="window.open('${escapeHtml(originalUrl)}', '_blank');"
          title="클릭하여 원본 이미지 보기"
        />
      `;
    };

    // 개별 채팅 메시지 DOM 엘리먼트 렌더링 및 추가
    function renderChatMessage(msg, autoScroll = true) {
      if (!chatMessages || !msg) return;

      // 빈 상태 안내 문구 제거
      const emptyNotice = chatMessages.querySelector('.chat-empty');
      if (emptyNotice) {
        emptyNotice.remove();
      }

      const email = msg.user_email || msg.senderEmail || '';
      const contentText = msg.content !== undefined ? msg.content : (msg.text || '');

      // 본인 메시지 판별 (이메일 또는 user_id 기준)
      const isMine = Boolean(
        currentChatUser && (
          (currentChatUser.email && email && email.toLowerCase() === currentChatUser.email.toLowerCase()) ||
          (currentChatUser.id && msg.user_id && msg.user_id === currentChatUser.id) ||
          (currentChatUser.id && msg.senderId && msg.senderId === currentChatUser.id)
        )
      );

      const userId = msg.user_id || msg.senderId || (isMine && currentChatUser ? currentChatUser.id : '');

      const wrapper = document.createElement('div');
      wrapper.className = `chat-bubble-wrapper ${isMine ? 'mine' : 'other'}`;
      wrapper.setAttribute('data-msg-id', msg.id);
      if (userId) wrapper.setAttribute('data-user-id', userId);
      if (email) wrapper.setAttribute('data-user-email', email.toLowerCase());

      // 각 메시지 옆에 보낸사람의 이메일 및 아바타 표시
      const emailLabel = isMine ? `${email} (나)` : (email || '익명');
      const timeStr = formatChatTime(msg.created_at || msg.timestamp);

      // 사용자별 아바타 이미지 URL 확인
      const avatarUrl = getAvatarUrlForUser(userId, email, isMine);

      const avatarHtml = `
        <span class="chat-msg-avatar" data-user-id="${escapeHtml(String(userId || ''))}" data-user-email="${escapeHtml(String(email || '').toLowerCase())}">
          ${avatarUrl ? `
            <img class="chat-msg-avatar-img" src="${escapeHtml(avatarUrl)}" alt="${escapeHtml(emailLabel)}" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
            <span class="chat-msg-avatar-fallback" style="display: none;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          ` : `
            <span class="chat-msg-avatar-fallback">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          `}
        </span>
      `;

      // 💡 4. 메시지 내용이 '![image](...)' 형식인지 판별하여 이미지 렌더링
      const imageMatch = String(contentText).trim().match(/^!\[(?:image|.*?)\]\((https?:\/\/[^\s)]+|data:image\/[^\s)]+)\)$/i);

      let bubbleContentHtml = '';
      let bubbleClass = 'chat-bubble';

      if (imageMatch) {
        const imageUrl = imageMatch[1];
        bubbleClass += ' has-image';
        bubbleContentHtml = `
          <div class="chat-image-container">
            <img 
              class="chat-sent-image" 
              src="${escapeHtml(imageUrl)}" 
              alt="채팅 이미지" 
              loading="lazy"
              onload="this.classList.add('loaded');"
              onerror="window.handleChatImageError(this, '${escapeHtml(imageUrl)}');"
              onclick="window.open('${escapeHtml(imageUrl)}', '_blank');"
              title="클릭하여 원본 이미지 보기"
            />
          </div>
        `;
      } else {
        bubbleContentHtml = escapeHtml(contentText);
      }

      wrapper.innerHTML = `
        <div class="chat-sender-info">
          ${avatarHtml}
          <span class="chat-sender-email">${escapeHtml(emailLabel)}</span>
        </div>
        <div class="${bubbleClass}">${bubbleContentHtml}</div>
        <span class="chat-timestamp">${timeStr}</span>
      `;

      chatMessages.appendChild(wrapper);

      if (autoScroll) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    // 전체 메시지 목록 렌더링
    function renderAllChatMessages() {
      if (!chatMessages) return;
      chatMessages.innerHTML = '';

      if (!chatMessagesList || chatMessagesList.length === 0) {
        chatMessages.innerHTML = `
          <div class="chat-empty">
            💬 아직 대화가 없습니다.<br>
            첫 번째 메시지를 남겨 실시간 대화를 시작해보세요!
          </div>
        `;
        return;
      }

      chatMessagesList.forEach(msg => {
        renderChatMessage(msg, false);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 수신된 새 메시지 처리 (중복 방지 및 렌더링)
    function handleIncomingChatMessage(newMsg) {
      if (!newMsg || newMsg.id === undefined || newMsg.id === null) return;

      // 이미 목록에 존재하는 메시지인지 검사 (중복 렌더링 방지)
      const exists = chatMessagesList.some(item => String(item.id) === String(newMsg.id));
      if (exists) return;

      chatMessagesList.push(newMsg);
      saveStoredChatMessages(chatMessagesList);
      renderChatMessage(newMsg, true);

      // 보낸 사용자의 아바타가 캐시에 없으면 자동 조회 및 채팅창 반영
      if (newMsg.user_id) {
        fetchAndApplyUserAvatar(newMsg.user_id, newMsg.user_email);
      }
    }

    // 3. 페이지가 처음 열릴 때, 기존에 있던 메시지들도 모두 가져와서 화면에 미리 표시
    async function loadSupabaseMessages() {
      if (!supabase || typeof supabase.from !== 'function') {
        await initSupabase();
      }

      if (supabase && typeof supabase.from === 'function') {
        try {
          console.log('📥 Supabase message 테이블에서 기존 메시지 조회 중...');
          const { data, error } = await supabase
            .from('message')
            .select('*')
            .order('id', { ascending: true })
            .limit(200);

          if (error) {
            console.warn('Supabase message 조회 오류:', error);
          } else if (Array.isArray(data)) {
            console.log(`✅ 기존 메시지 ${data.length}개 로드 완료`);
            chatMessagesList = data.map(row => ({
              id: row.id,
              user_id: row.user_id,
              user_email: row.user_email,
              content: row.content,
              created_at: row.created_at || (row.id ? new Date(Number(row.id)).toISOString() : new Date().toISOString())
            }));
            saveStoredChatMessages(chatMessagesList);
            renderAllChatMessages();

            // 💡 다른 사용자들의 프로필 사진을 백그라운드에서 일괄 조회하여 즉시 표시
            const userMap = new Map();
            chatMessagesList.forEach(m => {
              if (m.user_id && !userMap.has(m.user_id)) {
                userMap.set(m.user_id, m.user_email);
              }
            });
            userMap.forEach((uEmail, uId) => {
              fetchAndApplyUserAvatar(uId, uEmail);
            });
            return;
          }
        } catch (e) {
          console.warn('Supabase message 조회 예외:', e);
        }
      }

      // Supabase 조회 실패 또는 미연결 시 로컬 캐시 사용
      chatMessagesList = getStoredChatMessages();
      renderAllChatMessages();
    }

    // 메시지 전송 로직 (Supabase 'message' 테이블 insert 연동)
    async function sendChatMessage() {
      if (!chatInput) return;
      const text = chatInput.value.trim();
      if (!text) {
        chatInput.focus();
        return;
      }

      const email = currentChatUser?.email || '';
      if (!email) {
        alert('로그인 후 메시지를 전송할 수 있습니다.');
        return;
      }

      // 전송 버튼 비활성화 (중복 클릭 방지)
      if (btnSendChat) {
        btnSendChat.disabled = true;
        btnSendChat.style.opacity = '0.7';
      }

      try {
        // 1. Supabase 공식 클라이언트 확인 및 재초기화 시도
        if (!supabase || !isSupabaseConnected || typeof supabase.from !== 'function') {
          console.log('🔄 Supabase 클라이언트 연결 확인 중...');
          await initSupabase();
        }

        if (!supabase || typeof supabase.from !== 'function') {
          throw new Error('Supabase 클라이언트가 연결되지 않았습니다. 인터넷 연결 및 브라우저 설정을 확인해 주세요.');
        }

        const currentUserId = currentChatUser?.id || null;
        console.log('📤 Supabase message 테이블 insert 요청:', { content: text, user_email: email, user_id: currentUserId });

        // 💡 다른 사용자 화면에서도 프로필 사진을 볼 수 있도록 user_id를 함께 저장
        const messagePayload = {
          id: Date.now(),
          content: text,
          user_email: email,
          user_id: currentUserId
        };

        // 💡 요구사항: supabase.from('message').insert(...)
        let { data, error } = await supabase
          .from('message')
          .insert(messagePayload);

        // 혹시라도 user_id 컬럼 관련 비호환 오류 발생 시 안전 폴백 재시도
        if (error && currentUserId && error.code !== '42501') {
          console.warn('⚠️ user_id 포함 insert 실패, 폴백 재시도:', error.message);
          const fallbackPayload = { id: Date.now(), content: text, user_email: email };
          const retryRes = await supabase.from('message').insert(fallbackPayload);
          if (!retryRes.error) {
            error = null;
          }
        }

        if (error) {
          console.error('❌ Supabase message insert 에러:', error);
          if (error.code === '42501') {
            throw new Error(
              `Supabase RLS(행 보안 정책) 권한 오류 (코드 42501):\n\n` +
              `현재 계정이 Supabase에 로그인되지 않았거나, "message" 테이블의 INSERT 정책(Policy)이 활성화되지 않았습니다.\n\n` +
              `해결 방법:\n` +
              `1. 현재 화면에서 로그아웃 후 다시 로그인해 보세요.\n` +
              `2. Supabase 대시보드 > Table Editor > message > RLS Policies에서 "Enable insert for authenticated users" 또는 "Enable insert for anon/all" 정책이 있는지 확인해 주세요.`
            );
          }
          throw new Error(error.message || 'Supabase 테이블 저장 실패');
        }

        console.log('✅ Supabase message 테이블 insert 성공!');

        // 메시지 객체 구성
        const newMsg = {
          id: messagePayload.id,
          user_id: currentChatUser?.id || '',
          user_email: email,
          content: text,
          created_at: new Date().toISOString()
        };

        // 1. 로컬 상태 반영 및 UI 렌더링
        handleIncomingChatMessage(newMsg);

        // 2. 브라우저 탭 간 BroadcastChannel 전파
        if (chatBroadcastChannel) {
          try {
            chatBroadcastChannel.postMessage(newMsg);
          } catch (err) {
            console.warn('BroadcastChannel 전송 실패:', err);
          }
        }

        // 3. 💡 요구사항: 메시지 전송이 성공하면, 입력창의 내용은 깨끗하게 비워주기
        chatInput.value = '';
        chatInput.focus();

      } catch (err) {
        console.error('메시지 전송 실패:', err);
        alert(err.message || '메시지 전송 중 오류가 발생했습니다.');
      } finally {
        if (btnSendChat) {
          btnSendChat.disabled = false;
          btnSendChat.style.opacity = '1';
        }
      }
    }

    // ==========================================
    // 📷 채팅 이미지 첨부 및 전송 함수
    // ==========================================
    async function sendChatImage(file) {
      if (!file) return;

      // 1. 이미지 형식 검사
      if (!file.type.startsWith('image/')) {
        alert('이미지 파일(PNG, JPG, JPEG, WEBP, GIF 등)만 첨부할 수 있습니다.');
        return;
      }

      // 최대 10MB 크기 제한
      if (file.size > 10 * 1024 * 1024) {
        alert('이미지 파일 크기는 10MB 이하여야 합니다.');
        return;
      }

      const email = currentChatUser?.email || '';
      if (!email) {
        alert('로그인 후 이미지를 전송할 수 있습니다.');
        return;
      }

      // 버튼 로딩 상태 전환
      if (btnAttachImage) {
        btnAttachImage.disabled = true;
        btnAttachImage.style.opacity = '0.5';
      }
      if (btnSendChat) {
        btnSendChat.disabled = true;
        btnSendChat.style.opacity = '0.5';
      }

      let prevPlaceholder = '';
      if (chatInput) {
        prevPlaceholder = chatInput.placeholder;
        chatInput.placeholder = '이미지 업로드 중... ⏳';
      }

      try {
        if (!supabase || !isSupabaseConnected || typeof supabase.from !== 'function') {
          await initSupabase();
        }

        if (!supabase || !supabase.storage) {
          throw new Error('Supabase Storage 클라이언트를 찾을 수 없습니다.');
        }

        const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const currentUserId = currentChatUser?.id || null;
        // 💡 고유한 파일 경로 생성 (충돌 방지)
        const filePath = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}_${cleanName}`;

        console.log(`📤 chat-images 버킷으로 파일 업로드 시작: ${filePath}`);

        // 💡 1. supabase.storage.from('chat-images').upload() 함수 사용
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('chat-images')
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (uploadError) {
          console.error('❌ chat-images 업로드 오류:', uploadError);
          if (uploadError.statusCode === '403' || uploadError.error === 'Unauthorized' || (uploadError.message && uploadError.message.includes('row-level security'))) {
            throw new Error('Supabase "chat-images" 버킷의 INSERT 정책(RLS)을 확인해 주세요. (로그인 필요)');
          }
          throw new Error(uploadError.message || '이미지 파일 업로드 실패');
        }

        console.log('✅ chat-images 업로드 성공:', uploadData);

        // 💡 2. supabase.storage.from('chat-images').getPublicUrl() 함수 사용
        const { data: urlData } = supabase.storage
          .from('chat-images')
          .getPublicUrl(filePath);

        const publicUrl = urlData?.publicUrl;
        if (!publicUrl) {
          throw new Error('업로드된 이미지의 공개 URL을 가져오지 못했습니다.');
        }

        console.log('🔗 이미지 공개 URL:', publicUrl);

        // 💡 3. 'message' 테이블에 새로운 행 추가 (content 컬럼에 '![image](이미지_URL)' 형식으로 저장)
        const imageMarkdown = `![image](${publicUrl})`;
        const messagePayload = {
          id: Date.now(),
          content: imageMarkdown,
          user_email: email,
          user_id: currentUserId
        };

        let { data: insertData, error: insertError } = await supabase
          .from('message')
          .insert(messagePayload);

        // 혹시 모를 messages 테이블 폴백
        if (insertError && insertError.code === '42P01') {
          const retryRes = await supabase.from('messages').insert(messagePayload);
          if (!retryRes.error) insertError = null;
        }

        if (insertError) {
          console.error('❌ 메시지 테이블 저장 실패:', insertError);
          throw new Error(insertError.message || '이미지 메시지 저장 실패');
        }

        console.log('✅ 이미지 메시지 DB 저장 완료');

        // 로컬 UI 즉시 반영
        const newMsg = {
          id: messagePayload.id,
          user_id: currentUserId,
          user_email: email,
          content: imageMarkdown,
          created_at: new Date().toISOString()
        };

        handleIncomingChatMessage(newMsg);

        // 브라우저 다른 탭 전파
        if (chatBroadcastChannel) {
          try {
            chatBroadcastChannel.postMessage(newMsg);
          } catch (bErr) {
            console.warn('BroadcastChannel 전송 실패:', bErr);
          }
        }

      } catch (err) {
        console.error('이미지 첨부 전송 처리 실패:', err);
        alert(`이미지 전송 실패: ${err.message}`);
      } finally {
        if (btnAttachImage) {
          btnAttachImage.disabled = false;
          btnAttachImage.style.opacity = '1';
        }
        if (btnSendChat) {
          btnSendChat.disabled = false;
          btnSendChat.style.opacity = '1';
        }
        if (chatInput && prevPlaceholder) {
          chatInput.placeholder = prevPlaceholder;
        }
      }
    }

    // 다른 탭에서의 localStorage 변경 감지 (폴백 동기화)
    function handleChatStorageEvent(e) {
      if (e.key === CHAT_STORAGE_KEY && e.newValue) {
        try {
          const updated = JSON.parse(e.newValue);
          if (Array.isArray(updated)) {
            // 새로 들어온 메시지들만 식별하여 추가
            updated.forEach(msg => {
              if (msg && msg.id && !chatMessagesList.some(item => item.id === msg.id)) {
                chatMessagesList.push(msg);
                renderChatMessage(msg, true);
              }
            });
          }
        } catch (err) {
          console.warn('채팅 스토리지 동기화 실패:', err);
        }
      }
    }

    // 실시간 채팅 초기화
    function initRealtimeChat(user) {
      currentChatUser = user;

      // Supabase message 테이블 및 로컬 캐시에서 이전 대화 불러오기
      loadSupabaseMessages();

      // 브라우저 탭 간 실시간 통신 (BroadcastChannel) 설정
      if (typeof BroadcastChannel !== 'undefined') {
        if (!chatBroadcastChannel) {
          try {
            chatBroadcastChannel = new BroadcastChannel('emotion_diary_realtime_chat');
            chatBroadcastChannel.onmessage = (event) => {
              if (event && event.data) {
                if (event.data.type === 'AVATAR_UPDATE') {
                  updateChatAvatars(event.data.user_id, event.data.user_email, event.data.avatar_url);
                } else {
                  handleIncomingChatMessage(event.data);
                }
              }
            };
          } catch (e) {
            console.warn('BroadcastChannel 생성 오류:', e);
          }
        }
      }

      // 1. 요구사항: supabase.channel('message').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message' }, callback).subscribe() 형태 사용
      if (supabase && typeof supabase.channel === 'function' && !supabaseChatChannel) {
        try {
          supabaseChatChannel = supabase
            .channel('message')
            .on(
              'postgres_changes',
              { event: 'INSERT', schema: 'public', table: 'message' },
              (payload) => {
                console.log('⚡ [Realtime INSERT 이벤트 발생]:', payload);
                if (payload && payload.new) {
                  const row = payload.new;
                  // 2. 새로운 메시지가 도착하면 그 메시지 데이터를 화면의 채팅 메시지 영역에 추가해서 보여줌
                  const newMsg = {
                    id: row.id,
                    user_id: row.user_id,
                    user_email: row.user_email,
                    content: row.content,
                    created_at: row.created_at || (row.id ? new Date(Number(row.id)).toISOString() : new Date().toISOString())
                  };
                  handleIncomingChatMessage(newMsg);
                }
              }
            )
            .subscribe((status, err) => {
              console.log('⚡ Supabase "message" 채널 구독 상태:', status, err || '');
              if (chatStatusBadge) {
                if (status === 'SUBSCRIBED') {
                  chatStatusBadge.innerHTML = '<span class="chat-status-dot"></span>실시간 연결됨';
                }
              }
            });
        } catch (err) {
          console.warn('Supabase Realtime 채널 설정 실패:', err);
        }
      }

      // 스토리지 변경 이벤트 리스너 등록
      window.removeEventListener('storage', handleChatStorageEvent);
      window.addEventListener('storage', handleChatStorageEvent);

      // 프로필 아바타 로드
      loadUserProfileAvatar(user);
    }

    // ==========================================
    // 👤 실시간 채팅 상단 프로필 사진 기능 모듈
    // ==========================================

    // 프로필 아바타 UI 업데이트 (사진이 있으면 img 표시, 없으면 기본 사람 아이콘 표시)
    function updateProfileAvatarUI(imageUrl) {
      if (!profileAvatarImg || !profileDefaultIcon) return;
      if (imageUrl && typeof imageUrl === 'string' && imageUrl.trim()) {
        profileAvatarImg.src = imageUrl;
        profileAvatarImg.style.display = 'block';
        profileDefaultIcon.style.display = 'none';
      } else {
        profileAvatarImg.src = '';
        profileAvatarImg.style.display = 'none';
        profileDefaultIcon.style.display = 'flex';
      }
    }

    // 프로필 업로드 상태 안내 표시
    function setProfileUploadStatus(msg, type = 'info') {
      if (!profileUploadStatus) return;
      if (!msg) {
        profileUploadStatus.textContent = '';
        profileUploadStatus.style.display = 'none';
        return;
      }
      profileUploadStatus.textContent = msg;
      profileUploadStatus.className = `profile-upload-status ${type}`;
      profileUploadStatus.style.display = 'block';
      if (type === 'success' || type === 'info') {
        setTimeout(() => {
          if (profileUploadStatus.textContent === msg) {
            profileUploadStatus.style.display = 'none';
          }
        }, 4000);
      }
    }

    // 사용자 프로필 사진 로드
    async function loadUserProfileAvatar(user) {
      if (!user) {
        updateProfileAvatarUI(null);
        return;
      }

      // 1. user_metadata에서 avatar_url 또는 picture 확인
      let avatarUrl = user.user_metadata?.avatar_url || user.user_metadata?.picture || null;

      // 2. localStorage 캐시 확인
      if (!avatarUrl && user.id) {
        avatarUrl = localStorage.getItem(`user_avatar_${user.id}`);
      }

      // 3. Supabase Storage 'avatars' 버킷에서 실제 아바타 파일 탐색
      if (!avatarUrl && user.id && supabase && supabase.storage) {
        try {
          const { data: files, error } = await supabase.storage.from('avatars').list(user.id, {
            limit: 5,
            sortBy: { column: 'created_at', order: 'desc' }
          });
          if (!error && Array.isArray(files) && files.length > 0) {
            const targetFile = files.find(f => f.name && !f.name.startsWith('.')) || files[0];
            if (targetFile) {
              const { data: pubData } = supabase.storage.from('avatars').getPublicUrl(`${user.id}/${targetFile.name}`);
              if (pubData && pubData.publicUrl) {
                avatarUrl = `${pubData.publicUrl}?t=${targetFile.updated_at ? new Date(targetFile.updated_at).getTime() : Date.now()}`;
                localStorage.setItem(`user_avatar_${user.id}`, avatarUrl);
              }
            }
          }
        } catch (e) {
          console.warn('Supabase avatars 조회 실패:', e);
        }
      }

      if (avatarUrl) {
        userAvatarCache[user.id] = avatarUrl;
        if (user.email) userAvatarCache[user.email.toLowerCase()] = avatarUrl;
        updateProfileAvatarUI(avatarUrl);
        updateChatAvatars(user.id, user.email, avatarUrl);
      } else {
        updateProfileAvatarUI(null);
        if (user.id) {
          fetchAndApplyUserAvatar(user.id, user.email);
        }
      }
    }

    // 프로필 이미지 파일 선택 및 업로드 처리
    async function handleProfileImageChange(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      // 이미지 파일 형식 검사
      if (!file.type.startsWith('image/')) {
        alert('이미지 파일(PNG, JPG, JPEG, WEBP, GIF 등)만 선택할 수 있습니다.');
        e.target.value = '';
        return;
      }

      // 파일 용량 검사 (최대 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('이미지 파일 크기는 5MB 이하여야 합니다.');
        e.target.value = '';
        return;
      }

      // 1. 선택 즉시 로컬 미리보기 반영
      const objectUrl = URL.createObjectURL(file);
      updateProfileAvatarUI(objectUrl);
      setProfileUploadStatus('프로필 사진 업로드 중... ⏳', 'info');

      // 로그인된 사용자 정보 확인 (세션 보강)
      let user = currentChatUser;
      if (!user?.id && supabase?.auth?.getUser) {
        try {
          const authRes = await supabase.auth.getUser();
          if (authRes.data?.user) {
            user = authRes.data.user;
            currentChatUser = user;
          }
        } catch (err) {}
      }

      const userId = user?.id;
      const userEmail = user?.email;

      if (!userId) {
        // 비로그인/데모 모드일 때 로컬 Base64 보존
        const reader = new FileReader();
        reader.onload = (readEvent) => {
          const base64Data = readEvent.target.result;
          localStorage.setItem('user_avatar_default', base64Data);
          updateProfileAvatarUI(base64Data);
          updateChatAvatars('demo', userEmail || 'user', base64Data);
          setProfileUploadStatus('프로필 사진이 로컬에 저장되었습니다. ✨', 'success');
        };
        reader.readAsDataURL(file);
        e.target.value = '';
        return;
      }

      try {
        if (!supabase || !supabase.storage) {
          throw new Error('Supabase 클라이언트를 찾을 수 없습니다.');
        }

        // 💡 1. 파일 경로는 사용자의 ID를 사용해서 고유하게 만듦: [user_id]/avatar.png
        const filePath = `${userId}/avatar.png`;
        console.log(`📤 Supabase 'avatars' 버킷 업로드 시작: ${filePath}`);

        // 💡 1. supabase.storage.from('avatars').upload() 함수 사용
        const { data: uploadData, error: uploadError } = await supabase.storage
          .from('avatars')
          .upload(filePath, file, {
            cacheControl: '0',
            upsert: true
          });

        if (uploadError) {
          console.error('❌ Supabase storage upload 에러:', uploadError);
          throw uploadError;
        }

        console.log('✅ Supabase storage upload 성공:', uploadData);

        // 💡 2. 업로드가 성공하면, 방금 업로드한 파일의 공개URL을 가져옴
        // supabase.storage.from('avatars').getPublicUrl() 함수 사용
        const { data: urlData } = supabase.storage
          .from('avatars')
          .getPublicUrl(filePath);

        const publicUrl = urlData?.publicUrl;
        if (!publicUrl) {
          throw new Error('공개 URL을 가져오지 못했습니다.');
        }

        // 브라우저 캐시 무효화를 위해 타임스탬프 쿼리 추가
        const displayUrl = `${publicUrl}?t=${Date.now()}`;
        console.log('🔗 프로필 사진 공개 URL:', displayUrl);

        // 💡 3. 가져온 URL을 Supbase Auth의 사용자 메타데이터에 저장
        // supabase.auth.updateUser({ data: { avatar_url: URL } }) 함수 사용
        if (supabase.auth && typeof supabase.auth.updateUser === 'function') {
          try {
            const { data: authUpdateData, error: authUpdateError } = await supabase.auth.updateUser({
              data: { avatar_url: publicUrl }
            });
            if (authUpdateError) {
              console.warn('⚠️ Supabase Auth 메타데이터 업데이트 경고:', authUpdateError.message);
            } else {
              console.log('✅ Supabase Auth 메타데이터 저장 완료:', authUpdateData);
            }
          } catch (authErr) {
            console.warn('⚠️ Supabase Auth updateUser 예외:', authErr);
          }
        }

        // 💡 4. 프로필 사진이 업데이트 되면, 화면 상단의 프로필 이미지도 즉시 새로운 사진으로 변경
        updateProfileAvatarUI(displayUrl);
        if (currentChatUser) {
          if (!currentChatUser.user_metadata) currentChatUser.user_metadata = {};
          currentChatUser.user_metadata.avatar_url = publicUrl;
        }
        userAvatarCache[userId] = displayUrl;
        if (userEmail) userAvatarCache[userEmail.toLowerCase()] = displayUrl;
        localStorage.setItem(`user_avatar_${userId}`, displayUrl);

        // 💡 5. 채팅에서 사용자별 이미지도 업데이트되면 즉시 새로운 사진이 나타나게 연결
        updateChatAvatars(userId, userEmail, displayUrl);

        // 브라우저 다른 탭들에도 실시간 전파 (BroadcastChannel)
        if (chatBroadcastChannel) {
          try {
            chatBroadcastChannel.postMessage({
              type: 'AVATAR_UPDATE',
              user_id: userId,
              user_email: userEmail,
              avatar_url: displayUrl
            });
          } catch (bErr) {
            console.warn('BroadcastChannel 전송 실패:', bErr);
          }
        }

        setProfileUploadStatus('프로필 사진이 성공적으로 변경되었습니다! ✨', 'success');

      } catch (err) {
        console.error('❌ 프로필 사진 업로드 처리 실패:', err);

        // 로컬 Base64 폴백 저장
        const reader = new FileReader();
        reader.onload = (readEvent) => {
          const base64Data = readEvent.target.result;
          if (userId) {
            localStorage.setItem(`user_avatar_${userId}`, base64Data);
          }
          updateProfileAvatarUI(base64Data);
          updateChatAvatars(userId, userEmail, base64Data);
        };
        reader.readAsDataURL(file);

        let errorMsg = err.message || '사진 저장 중 오류가 발생했습니다.';
        if (err.statusCode === '403' || err.code === '42501' || (err.message && err.message.includes('row-level security'))) {
          errorMsg = 'Supabase avatars 버킷 보안 정책(RLS)을 확인해 주세요.';
        }
        setProfileUploadStatus(`오류: ${errorMsg}`, 'error');
        alert(`프로필 사진 업로드 실패: ${errorMsg}`);
      } finally {
        e.target.value = '';
      }
    }

    // 프로필 사진 변경 이벤트 연결 (동그란 이미지 또는 '사진변경' 버튼 클릭 시 파일 선택창 열기)
    if (profileAvatarBtn && profileFileInput) {
      profileAvatarBtn.addEventListener('click', () => {
        profileFileInput.click();
      });
      profileAvatarBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          profileFileInput.click();
        }
      });
    }

    if (btnChangeProfilePhoto && profileFileInput) {
      btnChangeProfilePhoto.addEventListener('click', () => {
        profileFileInput.click();
      });
    }

    if (profileFileInput) {
      profileFileInput.addEventListener('change', handleProfileImageChange);
    }

    // 채팅 종료 및 정리 (로그아웃 시 호출)
    function leaveRealtimeChat() {
      currentChatUser = null;
      updateProfileAvatarUI(null);
      if (supabaseChatChannel && supabase && typeof supabase.removeChannel === 'function') {
        try {
          supabase.removeChannel(supabaseChatChannel);
        } catch (e) {}
        supabaseChatChannel = null;
      }
      window.removeEventListener('storage', handleChatStorageEvent);
    }

    // 채팅 폼 및 버튼 이벤트 연결
    if (chatForm) {
      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendChatMessage();
      });
    }

    // 클립 모양 이미지 첨부 버튼 이벤트 연결 (파일 선택창 열기)
    if (btnAttachImage && chatImageInput) {
      btnAttachImage.addEventListener('click', () => {
        chatImageInput.click();
      });
    }

    // 이미지 파일 선택 시 이벤트 처리 (chat-images 버킷 업로드 및 메시지 전송)
    if (chatImageInput) {
      chatImageInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        // 동일한 파일 재선택을 위해 value 초기화
        e.target.value = '';

        await sendChatImage(file);
      });
    }

    if (btnSendChat) {
      btnSendChat.addEventListener('click', (e) => {
        e.preventDefault();
        sendChatMessage();
      });
    }

    if (chatInput) {
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          sendChatMessage();
        }
      });
    }

    // Enter 키로 편리한 로그인 지원
    authEmail.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        authPassword.focus();
      }
    });

    authPassword.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin();
      }
    });

    // 음성 인식 (Web Speech API) 기능 연결
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let initialText = '';

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        btnVoice.classList.add('recording');
        btnVoice.querySelector('span').textContent = '음성 인식 중';

        initialText = diaryInput.value;
        if (initialText && !initialText.endsWith(' ') && !initialText.endsWith('\n')) {
          initialText += ' ';
        }
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        diaryInput.value = initialText + transcript;
        diaryInput.scrollTop = diaryInput.scrollHeight;
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        stopRecording();
        if (event.error === 'network') {
          alert('음성 인식 네트워크 오류가 발생했습니다.\n인터넷 연결 상태를 확인해 주세요.');
        } else if (event.error === 'not-allowed') {
          alert('마이크 사용 권한이 차단되어 있습니다. 브라우저 주소창 좌측 아이콘을 클릭하여 마이크 권한을 허용해 주세요.');
        } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
          alert('음성 인식 오류: ' + event.error);
        }
      };

      recognition.onend = () => {
        stopRecording();
      };
    }

    function stopRecording() {
      isRecording = false;
      btnVoice.classList.remove('recording');
      btnVoice.querySelector('span').textContent = '음성으로 입력하기';
    }

    btnVoice.addEventListener('click', () => {
      if (!recognition) {
        alert('현재 브라우저에서는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 이용해 주세요.');
        return;
      }

      if (isRecording) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error('Recognition start error:', e);
        }
      }
    });

    // 분석 요청하기: Google Gemini API 백엔드 호출 및 Redis 저장 연동
    btnAnalyze.addEventListener('click', async () => {
      const text = diaryInput.value.trim();
      if (!text) {
        alert('오늘 하루에 대한 이야기를 먼저 작성해주세요!');
        diaryInput.focus();
        return;
      }

      btnAnalyze.disabled = true;
      btnAnalyze.style.opacity = '0.7';
      aiResponse.classList.remove('has-content');
      aiResponse.textContent = 'Gemini AI가 당신의 일기를 읽고 분석하는 중입니다... 💭✨';

      try {
        const token = await getAuthToken();
        const requestHeaders = {
          'Content-Type': 'application/json'
        };
        if (token) {
          requestHeaders['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(`${API_BASE_URL}/api/analyze`, {
          method: 'POST',
          headers: requestHeaders,
          body: JSON.stringify({ diaryText: text })
        });

        let data;
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          data = await response.json();
        } else {
          const raw = await response.text();
          throw new Error(raw || '서버 응답 오류');
        }

        if (!response.ok) {
          throw new Error(data.error || '분석 중 오류가 발생했습니다.');
        }

        aiResponse.classList.add('has-content');
        aiResponse.textContent = data.reply;

        // 로컬 스토리지에 최신 데이터 임시 캐시 및 사용자 전용 히스토리 보존
        try {
          const currentSession = getAuthSession();
          const currentUserId = currentSession?.id;

          // 사용자 전용 키로 임시 보존 (타인 노출 원천 차단)
          if (currentUserId) {
            localStorage.setItem(`emotionDiary_text_${currentUserId}`, text);
            localStorage.setItem(`emotionDiary_aiReply_${currentUserId}`, data.reply);
          }
          localStorage.removeItem('emotionDiary_text');
          localStorage.removeItem('emotionDiary_aiReply');

          const userCacheKey = 'emotionDiary_history_' + (currentUserId || (currentSession?.email ? currentSession.email.replace(/[^a-zA-Z0-9]/g, '_') : 'default'));
          const localHistory = JSON.parse(localStorage.getItem(userCacheKey) || '[]');
          localHistory.unshift({
            id: data.diaryId || ('diary-' + Date.now()),
            userId: currentUserId || null,
            diaryText: text,
            aiReply: data.reply,
            createdAt: new Date().toISOString()
          });
          localStorage.setItem(userCacheKey, JSON.stringify(localHistory.slice(0, 50)));
        } catch (storageErr) {
          console.warn('로컬 스토리지 저장 실패:', storageErr);
        }

        // 새 일기 저장이 완료되었으므로 히스토리 목록 자동 갱신!
        loadDiaryHistory();

      } catch (error) {
        console.error('Analysis error:', error);
        aiResponse.classList.add('has-content');
        aiResponse.textContent = `⚠️ 분석 실패:\n${error.message}`;
      } finally {
        btnAnalyze.disabled = false;
        btnAnalyze.style.opacity = '1';
      }
    });

    // 날짜 포맷 변환 헬퍼 (예: diary-20260912163603 또는 ISO 문자열)
    function formatDate(rawId, createdAt) {
      if (createdAt) {
        try {
          const d = new Date(createdAt);
          if (!isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${yyyy}. ${mm}. ${dd} ${hh}:${min}`;
          }
        } catch {}
      }

      // id가 diary-YYYYMMDDHHmmss 형태인 경우 파싱
      if (rawId && rawId.startsWith('diary-')) {
        const numPart = rawId.replace('diary-', '');
        if (numPart.length >= 12) {
          const y = numPart.substring(0, 4);
          const m = numPart.substring(4, 6);
          const d = numPart.substring(6, 8);
          const h = numPart.substring(8, 10);
          const min = numPart.substring(10, 12);
          return `${y}. ${m}. ${d} ${h}:${min}`;
        }
      }

      return '최근 일기';
    }

    // AI 답변에서 감정 추출 및 뱃지 스타일 결정
    function extractEmotion(reply) {
      if (!reply) return { text: '감정 분석', className: '' };
      const match = reply.match(/감정\s*:\s*([^\n\r]+)/);
      if (match && match[1]) {
        const em = match[1].trim();
        let cls = '';
        if (em.includes('기쁨') || em.includes('행복') || em.includes('신남')) cls = 'happy';
        else if (em.includes('평온') || em.includes('편안') || em.includes('안정')) cls = 'calm';
        else if (em.includes('슬픔') || em.includes('우울') || em.includes('외로움')) cls = 'sad';
        else if (em.includes('불안') || em.includes('걱정') || em.includes('긴장')) cls = 'anxious';
        else if (em.includes('분노') || em.includes('화') || em.includes('답답')) cls = 'angry';
        return { text: em, className: cls };
      }
      return { text: '감정 분석', className: '' };
    }

    // Serverless Redis로부터 일기 히스토리 불러오기 (현재 로그인한 사용자 전용)
    async function loadDiaryHistory() {
      try {
        const token = await getAuthToken();
        const requestHeaders = {};
        if (token) {
          requestHeaders['Authorization'] = `Bearer ${token}`;
        }

        const res = await fetch(`${API_BASE_URL}/api/history`, {
          headers: requestHeaders,
          cache: 'no-store'
        });

        let data;
        const contentType = res.headers.get('content-type') || '';

        if (contentType.includes('application/json')) {
          data = await res.json();
        } else {
          const rawText = await res.text();
          if (rawText.includes('Forbidden') || res.status === 403) {
            throw new Error(`백엔드 접근 권한이 없습니다 (403 Forbidden). 브라우저 주소창에 http://localhost:3000 으로 접속해 주세요.`);
          }
          try {
            data = JSON.parse(rawText);
          } catch {
            throw new Error(rawText ? rawText.slice(0, 100) : '히스토리 데이터 파싱 실패');
          }
        }

        if (res.status === 401) {
          throw new Error('로그인 인증이 만료되었거나 올바르지 않습니다. 다시 로그인해 주세요.');
        }

        if (!res.ok || !data.success) {
          throw new Error(data.error || '히스토리를 불러오지 못했습니다.');
        }

        let list = data.diaries || [];

        // 현재 사용자 전용 로컬 캐시 동기화 (오프라인 폴백용)
        const currentSession = getAuthSession();
        const currentUserId = currentSession?.id;
        const userCacheKey = 'emotionDiary_history_' + (currentUserId || (currentSession?.email ? currentSession.email.replace(/[^a-zA-Z0-9]/g, '_') : 'default'));

        // 클라이언트 사이드 추가 격리 검증: 본인 userId와 일치하는 일기만 통과
        if (currentUserId) {
          list = list.filter(item => item && item.userId === currentUserId);
        }

        try {
          // 백엔드에서 인증된 사용자 데이터만 정확히 캐시
          localStorage.setItem(userCacheKey, JSON.stringify(list.slice(0, 50)));
          // 예전 버전의 공용 캐시가 남아있다면 제거하여 데이터 오염 방지
          localStorage.removeItem('emotionDiary_history');
        } catch (e) {}

        // 최신순 정렬
        list.sort((a, b) => {
          const keyA = a.id || a.createdAt || '';
          const keyB = b.id || b.createdAt || '';
          return keyB.localeCompare(keyA);
        });

        historyCount.textContent = list.length;

        if (list.length === 0) {
          historyList.innerHTML = `
            <div class="empty-history">
              🌱 아직 저장된 일기 히스토리가 없습니다.<br>
              첫 번째 일기를 작성하고 AI의 따뜻한 분석을 받아보세요!
            </div>
          `;
          return;
        }

        renderHistoryCards(list);

      } catch (err) {
        console.error('History load error:', err);

        // 서버 로드 실패 시 사용자 전용 로컬스토리지 히스토리 폴백 렌더링
        const currentSession = getAuthSession();
        const currentUserId = currentSession?.id;
        const userCacheKey = 'emotionDiary_history_' + (currentUserId || (currentSession?.email ? currentSession.email.replace(/[^a-zA-Z0-9]/g, '_') : 'default'));
        let localList = [];
        try {
          localList = JSON.parse(localStorage.getItem(userCacheKey) || '[]');
          if (currentUserId && Array.isArray(localList)) {
            localList = localList.filter(item => item && item.userId === currentUserId);
          }
        } catch (e) {}

        if (localList.length > 0) {
          historyCount.textContent = localList.length;
          renderHistoryCards(localList);
          return;
        }

        let errorTip = '';
        if (window.location.protocol === 'file:') {
          errorTip = '<br><span style="color:#4f46e5;font-weight:600;font-size:12px;">💡 브라우저 주소창에 <b>http://localhost:3000</b> 으로 접속하시면 로컬 서버 API와 완벽히 통신할 수 있습니다!</span>';
        }

        historyList.innerHTML = `
          <div class="error-history">
            ⚠️ 히스토리를 불러오는 중 오류가 발생했습니다.<br>
            <small style="color:#ef4444;">${escapeHtml(err.message)}</small>
            ${errorTip}
          </div>
        `;
      }
    }

    // 일기 카드 목록 렌더링 함수
    function renderHistoryCards(list) {
      historyList.innerHTML = list.map(item => {
        const dateStr = formatDate(item.id, item.createdAt);
        const emotionInfo = extractEmotion(item.aiReply);
        const diaryText = (item.diaryText || '').trim();
        const aiReply = (item.aiReply || '').trim();

        return `
          <div class="history-card">
            <div class="card-top">
              <div class="card-date">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                ${dateStr}
              </div>
              <span class="emotion-tag ${emotionInfo.className}">
                ✨ ${emotionInfo.text}
              </span>
            </div>
            <div class="card-diary-content">${escapeHtml(diaryText)}</div>
            ${aiReply ? `
              <div class="card-ai-bubble">
                <div class="card-ai-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  </svg>
                  AI 상담가의 답장
                </div>
                <div>${escapeHtml(aiReply)}</div>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // HTML 태그 XSS 이스케이프 함수
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 새로고침 버튼 이벤트: 캐시 정리 및 재조회
    btnRefreshHistory.addEventListener('click', () => {
      btnRefreshHistory.style.transform = 'rotate(180deg)';
      const currentSession = getAuthSession();
      cleanupLegacyHistoryCaches(currentSession?.id);
      loadDiaryHistory().finally(() => {
        setTimeout(() => {
          btnRefreshHistory.style.transform = 'rotate(0deg)';
        }, 300);
      });
    });

    // 페이지 로드 시 초기화: Supabase 세션 및 로그인 상태 확인 후 화면 분기
    async function init() {
      // 1. Supabase 클라이언트 초기화
      await initSupabase();

      // 2. 과거 공통 캐시 및 타인 일기/답변 즉시 청소
      cleanupLegacyHistoryCaches(null);

      // 3. 페이지가 처음 로드될 때도 현재 로그인 상태 확인
      let currentUser = null;

      try {
        if (supabase && supabase.auth && supabase.auth.getSession) {
          const { data, error } = await supabase.auth.getSession();
          if (!error && data && data.session && data.session.user) {
            currentUser = {
              email: data.session.user.email,
              id: data.session.user.id
            };
          }
        }
      } catch (err) {
        console.warn('Supabase 세션 확인 오류:', err);
      }

      // Supabase 세션이 없다면 로컬 세션 캐시 확인
      if (!currentUser) {
        currentUser = getAuthSession();
      }

      // 이미 로그인 상태라면 바로 일기장 화면을 보여줌
      if (currentUser && currentUser.email) {
        saveAuthSession(currentUser);
        cleanupLegacyHistoryCaches(currentUser.id);
        showDiaryView(currentUser);
      } else {
        cleanupLegacyHistoryCaches(null);
        showAuthView();
      }

      // Supabase 세션 변경 감지 리스너 연결
      try {
        if (supabase && supabase.auth && supabase.auth.onAuthStateChange) {
          supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session && session.user) {
              const u = { email: session.user.email, id: session.user.id };
              saveAuthSession(u);
              showDiaryView(u);
            } else if (event === 'SIGNED_OUT') {
              removeAuthSession();
              showAuthView();
            }
          });
        }
      } catch (e) {}
    }

    init();
  </script>
</body>
</html>
